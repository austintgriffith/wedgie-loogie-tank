<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loogie Tank</title>
<style>
  :root { --water: #8fb9eb; --sand: #e8d296; --ink: #14171c; --muted: #4a5568; --card: #ffffffcc; --red: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--water); color: var(--ink); font: 17px/1.4 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 32px; }
  p { margin: 0 0 16px; color: var(--muted); }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; min-width: 0; padding: 12px; border: 2px solid var(--ink); border-radius: 10px; font: inherit; font-family: ui-monospace, monospace; font-size: 15px; }
  button { padding: 12px 18px; border: 2px solid var(--ink); border-radius: 10px; background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #tank { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 12px; min-height: 120px;
          display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
  .l { text-align: center; font-size: 13px; color: var(--muted); }
  .l svg { width: 100%; height: auto; display: block; }
  #msg { margin: 16px 0; min-height: 1.4em; font-weight: 600; }
  #msg.err { color: var(--red); }
  #send { width: 100%; }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Loogie Tank</h1>
  <p>Your Safe's loogies, swimming on your wedgie.</p>
  <form id="find">
    <input id="addr" placeholder="Safe address 0x…" autocomplete="off" spellcheck="false">
    <button>Find</button>
  </form>
  <div id="tank"></div>
  <div id="msg"></div>
  <button id="send" disabled>Send to wedgie</button>
  <footer>
    Open Loogie Tank on your wedgie, plug it in, press Send (Chrome on a computer).
    Loogies on Ethereum and Optimism. <a href="https://github.com/austintgriffith/wedgie-loogie-tank">Code</a>.
  </footer>
</main>
<script type="module">
import { loogiesOf, MAX } from "./loogies.mjs";

const $ = (id) => document.getElementById(id);
let rows = null;

function say(text, err = false) { $("msg").textContent = text; $("msg").className = err ? "err" : ""; }

// The loogie's own SVG (the contracts' renderTokenById), from its save row.
function svg([chain, id, color, chub, mouth]) {
  const m = mouth ? `<path d="M 130 240 Q 165 250 ${mouth} 235" stroke="black" stroke-width="3" fill="transparent" transform="translate(7,0)"/>` : "";
  return `<svg viewBox="95 115 220 160" xmlns="http://www.w3.org/2000/svg">
    <ellipse stroke-width="3" ry="29.5" rx="29.5" cy="154.5" cx="181.5" stroke="#000" fill="#fff"/>
    <ellipse ry="3.5" rx="2.5" cy="154.5" cx="173.5" stroke-width="3" stroke="#000" fill="#000"/>
    <ellipse fill="#${color}" stroke-width="3" cx="204.5" cy="211.8" rx="${chub}" ry="51.8" stroke="#000"/>
    <ellipse stroke-width="3" ry="29.5" rx="29.5" cy="168.5" cx="209.5" stroke="#000" fill="#fff"/>
    <ellipse ry="3.5" rx="3" cy="169.5" cx="208" stroke-width="3" fill="#000" stroke="#000"/>${m}</svg>`;
}

$("find").onsubmit = async (e) => {
  e.preventDefault();
  const a = $("addr").value.trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(a)) return say("That's not an address.", true);
  rows = null;
  $("send").disabled = true;
  $("tank").innerHTML = "";
  say("Looking…");
  try {
    rows = await loogiesOf(a);
  } catch (err) {
    return say("Couldn't read the chain: " + err.message, true);
  }
  $("tank").innerHTML = rows.map((r) => `<div class="l">${svg(r)}${r[0] === "op" ? "OP" : "ETH"} #${r[1]}</div>`).join("");
  if (!rows.length) return say("No loogies here.");
  say(rows.length === MAX ? `${MAX} loogies (a tank holds ${MAX}).` : `${rows.length} loog${rows.length === 1 ? "ie" : "ies"}.`);
  $("send").disabled = false;
};

// WebSerial: one JSON line out, read lines back until the answer with our id.
async function ask(port, msg, ms = 5000) {
  const w = port.writable.getWriter();
  await w.write(new TextEncoder().encode(JSON.stringify(msg) + "\n"));
  w.releaseLock();
  const r = port.readable.getReader();
  const dec = new TextDecoder();
  let buf = "";
  const stop = setTimeout(() => r.cancel(), ms);
  try {
    for (;;) {
      const { value, done } = await r.read();
      if (done) throw new Error("no answer from the wedgie");
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        try { const m = JSON.parse(line); if (m.id === msg.id) return m; } catch {}
      }
    }
  } finally {
    clearTimeout(stop);
    r.releaseLock();
  }
}

$("send").onclick = async () => {
  if (!("serial" in navigator)) return say("This browser can't talk to a wedgie. Use Chrome on a computer.", true);
  let port;
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2e8a }] });
  } catch {
    return say("No wedgie picked.");
  }
  $("send").disabled = true;
  try {
    await port.open({ baudRate: 115200 });
    say("Talking to the wedgie…");
    const hi = await ask(port, { id: 1, type: "hello" });
    if (hi.running !== "tank") throw new Error("Open Loogie Tank on your wedgie first.");
    const ok = await ask(port, { id: 2, type: "tank", loogies: rows });
    if (ok.type !== "tank_ok") throw new Error(ok.error || "the wedgie said no");
    say(`In the tank: ${ok.n}. 🫧`);
  } catch (err) {
    say(err.message, true);
  } finally {
    try { await port.close(); } catch {}
    $("send").disabled = !rows?.length;
  }
};
</script>
</body>
</html>
